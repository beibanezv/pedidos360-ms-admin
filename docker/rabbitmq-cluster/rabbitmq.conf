# Descubrimiento clásico por nombre de nodo (misma red compose).
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.node_cleanup.interval = 10000
# NOTA: no se usa management.load_definitions (la guía de clase lo declara pero
# nunca crea el archivo definitions.json y el nodo falla al arrancar) ni
# queue_master_location (obsoleto en RabbitMQ 3.12+/4.x).
